<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Label Me — a wallet card face down: three grey label bars and a question mark; Nansen's label lands and the middle bar turns green">
<!-- STORYBOARD (dur 6s — must equal this file's single master dur)
  0-10%   steady state: the static icon — plate, grey / green / grey bars, the question mark on the green bar (poster; geometry = build/apps/web/app/icon.svg × 8)
  10-32%  trigger:      the green bar drops to grey — the card is face down, all three labels equally possible; the question mark pulses; a ring draws itself around the plate   data-story="beat-2"
  32-56%  mechanism:    A wallet card face down; Nansen's label lands and exactly one bar turns green.                                                                         data-story="beat-3"
  56-84%  resolution:   the green bar persists with a glow breath; the question mark fades — the label is known                                                                data-story="beat-4"
  84-100% breathe + seam: overlays fade 94-99% back to the poster
-->
<defs>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity="0"/><stop offset=".5" stop-color="#38bdf8" stop-opacity=".45"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="14"/></filter>
  <clipPath id="plate"><rect width="512" height="512" rx="112"/></clipPath>
</defs>
<style>
  @keyframes breath { 0%,58% { opacity: 0 } 66% { opacity: .7 } 76% { opacity: .25 } 86% { opacity: .7 } 94%,100% { opacity: 0 } }
  .breath { animation: breath 6s ease-in-out infinite }
  [data-story] { will-change: opacity }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<!-- poster: the static icon, fully visible at t=0 -->
<rect width="512" height="512" rx="112" fill="#0f141b"/>
<rect x="80" y="80"  width="352" height="96" rx="24" fill="#334155"/>
<rect x="80" y="208" width="352" height="96" rx="24" fill="#22c55e"/>
<rect x="80" y="336" width="352" height="96" rx="24" fill="#334155"/>
