<!-- beat 2: the ring draws itself in while Nansen is looked up -->
<rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="1936" stroke-dashoffset="1936" opacity="0" data-story="beat-2">
  <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;.10;.12;.44;.56;.94;1" dur="6s" repeatCount="indefinite"/>
  <animate attributeName="stroke-dashoffset" values="1936;1936;0;0;0;1936" keyTimes="0;.10;.36;.56;.94;1" dur="6s" repeatCount="indefinite"/>
</rect>
<!-- beat 3: the scan sweeps down the bars — the label is landing -->
<g clip-path="url(#plate)" opacity="0" data-story="beat-3">
  <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;.30;.33;.50;.56;.94;1" dur="6s" repeatCount="indefinite"/>
  <rect x="0" y="-160" width="512" height="160" fill="url(#scan)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 672;0 672;0 0" keyTimes="0;.32;.52;.94;1" dur="6s" repeatCount="indefinite"/>
  </rect>
</g>
<!-- beat 3→4: the middle bar turns green again — Nansen's label: the reveal -->
<rect x="80" y="208" width="352" height="96" rx="24" fill="#22c55e" opacity="0" data-story="beat-3">
  <animate attributeName="opacity" values="0;0;0;1;1;1;0;0" keyTimes="0;.10;.44;.48;.84;.94;.99;1" dur="6s" repeatCount="indefinite"/>
</rect>
<rect x="80" y="208" width="352" height="96" rx="24" fill="#22c55e" filter="url(#glow)" class="breath" opacity="0" data-story="beat-4"/>
</svg>
