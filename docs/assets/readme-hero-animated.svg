<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Label Me — a wallet card with four Nansen clues and five class chips; the Nansen label lands and the Smart Money chip turns green">
<!-- STORYBOARD (dur 8s — must equal this file's single master dur)
  0-10%   steady state: plate, mark, outlined wordmark, tagline; the card with its four clue rows, empty bars; five outlined chips (poster)
  10-30%  trigger:      the scan sweeps down the card; the four clue bars grow row by row — Nansen's numbers land             data-story="beat-2"
  30-58%  mechanism:    A wallet card with four Nansen clues; the label lands and exactly one chip turns green: Smart Money.  data-story="beat-3"
  58-82%  resolution:   the tell line appears under the card; the green chip persists                                       data-story="beat-4"
  82-100% breathe + seam: overlays fade 94-99% back to the poster
-->
<defs>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity="0"/><stop offset=".5" stop-color="#38bdf8" stop-opacity=".35"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="10"/></filter>
  <clipPath id="card"><rect x="640" y="36" width="600" height="248" rx="16"/></clipPath>
</defs>
<style>
  @keyframes breath { 0%,60% { opacity: 0 } 68% { opacity: .6 } 76% { opacity: .2 } 84% { opacity: .6 } 94%,100% { opacity: 0 } }
  .breath { animation: breath 8s ease-in-out infinite }
  [data-story] { will-change: opacity }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
